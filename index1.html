<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Public Practice</title>

<!-- jsPDF builds the PDF in the browser; autotable draws the records table -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<style>
body{
    font-family: Arial, Helvetica, sans-serif;
    width:600px;
    margin:40px auto;
}

a{
    display:block;
    margin-top:20px;
    color:blue;
    font-size:18px;
}

input{
    width:50%;
    padding:10px;
    margin-bottom:10px;
    font-size:16px;
}

button{
    padding:10px 20px;
    font-size:16px;
    cursor:pointer;
}

button:disabled{
    cursor:not-allowed;
}

#result, #recordsStatus{
    margin-top:20px;
    font-weight:bold;
}

hr{
    margin:30px 0;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
    background:#ffffff;
}

th, td{
    border:1px solid #b2bec3;
    padding:8px;
    text-align:left;
    vertical-align:top;
}

th{
    background:#b2bec3;
}
</style>
</head>
<body bgcolor="#dfe6e9">

<h2>Our Accounts Payable Table</h2>

<label>Date of Occurence</label>
<br>
<input type="date" id="date_of_occurence">
<br>

<label>Description</label>
<br>
<input type="text" id="desc">
<br>

<label>Amount Due</label>
<br>
<input type="number" id="amt_due" step="0.01" placeholder="0.00">
<br>

<label>Payee Comments</label>
<br>
<input type="text" id="payee_comments">
<br>

<label>Payer Comments</label>
<br>
<input type="text" id="payer_comments">
<br>

<button onclick="saveRecord()">Submit</button>

<div id="result"></div>

<hr>

<h2>Records</h2>

<input type="text" id="search" placeholder="Search name or description">
<button onclick="loadRecords()">Search</button>
<button id="pdfButton" onclick="savePdf()" disabled>Save as PDF</button>

<div id="recordsStatus"></div>

<table id="records">
    <thead>
        <tr>
            <th>Date of Occurence</th>
            <th>Description</th>
	    <th>Amount Due</th>
	    <th>Payee Comments</th>
	    <th>Payee Comments</th>

        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>

const API_URL =
"https://a30le4we7h.execute-api.us-east-1.amazonaws.com/default/lambdaTest";

// The records (and search term) from the last successful fetch,
// so the PDF matches exactly what is shown on the page
let lastRecords = [];
let lastSearch = "";

async function saveRecord(){

    const date_of_occurence = document.getElementById("date_of_occurence").value.trim();
    const desc = document.getElementById("desc").value.trim();
    const amt_due = document.getElementById("amt_due").value.trim();
    const payee_comments = document.getElementById("payee_comments").value.trim();
    const payer_comments = document.getElementById("payer_comments").value.trim();

    const resultDiv = document.getElementById("result");

    // Make sure all fields except the last 2 contain data
    if (!name || !desc) {
        resultDiv.innerHTML = "Please enter information into the fields.";
        return;
    }

    try {

        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                date_of_occurence: date_of_occurence,
                description: description,
		amt_due: amt_due,
		payee_comments: payee_comments,
		payer_comments: payer_comments
            })
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error || "Unable to save record");
        }

        resultDiv.innerHTML = "Status: " + result.Status;

        // Clear the fields if the save was successful
        document.getElementById("date_of_occurence").value = "";
        document.getElementById("description").value = "";
	document.getElementById("amt_due").value = "";
	document.getElementById("payee_comments").value = "";
	document.getElementById("payer_comments").value = "";

        document.getElementById("date_of_occurence").focus();

        // Refresh the table so the new record shows up
        loadRecords();

    } catch (error) {

        console.error(error);
        resultDiv.innerHTML = "Error: " + error.message;
    }
}

async function loadRecords(){

    const search = document.getElementById("search").value.trim();
    const statusDiv = document.getElementById("recordsStatus");
    const tbody = document.querySelector("#records tbody");
    const pdfButton = document.getElementById("pdfButton");

    statusDiv.innerHTML = "Loading...";
    pdfButton.disabled = true;

    try {

        const url = search
            ? API_URL + "?search=" + encodeURIComponent(search)
            : API_URL;

        const response = await fetch(url);
        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error || "Unable to load records");
        }

        tbody.innerHTML = "";

        // Use textContent (not innerHTML) so user-entered text can't inject HTML
        for (const record of result.records) {
            const row = document.createElement("tr");

            const nameCell = document.createElement("td");
            nameCell.textContent = record.name;

            const descCell = document.createElement("td");
            descCell.textContent = record.description;

            row.appendChild(nameCell);
            row.appendChild(descCell);
            tbody.appendChild(row);
        }

        statusDiv.innerHTML = result.records.length + " record(s) found";

        // Remember what was fetched so it can be saved as a PDF
        lastRecords = result.records;
        lastSearch = search;
        pdfButton.disabled = lastRecords.length === 0;

    } catch (error) {

        console.error(error);
        statusDiv.innerHTML = "Error: " + error.message;
    }
}

function savePdf(){

    const statusDiv = document.getElementById("recordsStatus");

    if (lastRecords.length === 0) {
        statusDiv.innerHTML = "There are no records to save.";
        return;
    }

    try {

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        const now = new Date();

        // Heading
        doc.setFontSize(16);
        doc.text("Practice Public Table - Records", 14, 18);

        doc.setFontSize(10);
        doc.text("Created: " + now.toLocaleString(), 14, 26);
        doc.text("Search: " + (lastSearch || "(all records)"), 14, 32);
        doc.text(lastRecords.length + " record(s)", 14, 38);

        // Records table (wraps long text and adds pages automatically)
        doc.autoTable({
            startY: 44,
            head: [["Name", "Description"]],
            body: lastRecords.map(record => [record.name, record.description]),
            styles: { fontSize: 10, cellPadding: 3, overflow: "linebreak" },
            headStyles: { fillColor: [178, 190, 195], textColor: 0 },
            columnStyles: { 0: { cellWidth: 50 } }
        });

        // File name like public_practice_2026-09-26.pdf
        const fileDate = now.getFullYear() + "-"
            + String(now.getMonth() + 1).padStart(2, "0") + "-"
            + String(now.getDate()).padStart(2, "0");

        doc.save("public_practice_" + fileDate + ".pdf");

    } catch (error) {

        console.error(error);
        statusDiv.innerHTML = "Error creating PDF: " + error.message;
    }
}

// Load the records when the page opens
loadRecords();

</script>
<a href="https://main.d859ji0i28ik.amplifyapp.com/">Return to home page</a>
</body>
</html>
