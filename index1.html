<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Accounts Payable Table</title>

<!-- jsPDF builds the PDF in the browser; autotable draws the records table -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<style>
body{
    font-family: Arial, Helvetica, sans-serif;
    width:600px;
    margin:40px auto;
}

a{
    display:block;
    margin-top:20px;
    color:blue;
    font-size:18px;
}

input{
    width:50%;
    padding:10px;
    margin-bottom:10px;
    font-size:16px;
}

button{
    padding:10px 20px;
    font-size:16px;
    cursor:pointer;
}

button:disabled{
    cursor:not-allowed;
}

#result, #recordsStatus{
    margin-top:20px;
    font-weight:bold;
}

hr{
    margin:30px 0;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
    background:#ffffff;
}

th, td{
    border:1px solid #b2bec3;
    padding:8px;
    text-align:left;
    vertical-align:top;
}

th{
    background:#b2bec3;
}
</style>
</head>

<body bgcolor="#dfe6e9">

<h2>Our Accounts Payable Table</h2>

<label>Date of Occurrence</label>
<br>
<input type="date" id="date_of_occurrence">
<br>

<label>Description</label>
<br>
<input type="text" id="desc">
<br>

<label>Amount Due</label>
<br>
<input type="number" id="amt_due" step="0.01" placeholder="0.00">
<br>

<label>Payee Comments</label>
<br>
<input type="text" id="payee_comments">
<br>

<label>Payer Comments</label>
<br>
<input type="text" id="payer_comments">
<br>

<button onclick="saveRecord()">Submit</button>

<div id="result"></div>

<hr>

<h2>Records</h2>

<input type="text" id="search" placeholder="Search description">
<button onclick="loadRecords()">Search</button>
<button id="pdfButton" onclick="savePdf()" disabled>Save as PDF</button>

<div id="recordsStatus"></div>

<table id="records">
    <thead>
        <tr>
            <th>Date of Occurrence</th>
            <th>Description</th>
            <th>Amount Due</th>
            <th>Payee Comments</th>
            <th>Payer Comments</th>
        </tr>
    </thead>

    <tbody></tbody>
</table>

<script>

const API_URL =
"https://e9beemph6k.execute-api.us-east-1.amazonaws.com/default/acctPayableTest";

// Records from the last successful fetch
let lastRecords = [];
let lastSearch = "";

async function saveRecord(){

    const date_of_occurrence =
        document.getElementById("date_of_occurrence").value.trim();

    const desc =
        document.getElementById("desc").value.trim();

    const amt_due =
        document.getElementById("amt_due").value.trim();

    const payee_comments =
        document.getElementById("payee_comments").value.trim();

    const payer_comments =
        document.getElementById("payer_comments").value.trim();

    const resultDiv = document.getElementById("result");

    // Validate required fields
    if (!date_of_occurrence || !desc || !amt_due) {
        resultDiv.innerHTML =
            "Please enter the date, description, and amount due.";
        return;
    }

    try {

        const response = await fetch(API_URL, {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                date_of_occurrence: date_of_occurrence,
                description: desc,
                amt_due: amt_due,
                payee_comments: payee_comments,
                payer_comments: payer_comments
            })
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(
                result.error || "Unable to save record"
            );
        }

        resultDiv.innerHTML =
            "Status: " + (result.Status || "Record saved successfully");

        // Clear form
        document.getElementById("date_of_occurrence").value = "";
        document.getElementById("desc").value = "";
        document.getElementById("amt_due").value = "";
        document.getElementById("payee_comments").value = "";
        document.getElementById("payer_comments").value = "";

        document.getElementById("date_of_occurrence").focus();

        // Refresh records
        loadRecords();

    } catch (error) {

        console.error(error);
        resultDiv.innerHTML =
            "Error: " + error.message;
    }
}


async function loadRecords(){

    const search =
        document.getElementById("search").value.trim();

    const statusDiv =
        document.getElementById("recordsStatus");

    const tbody =
        document.querySelector("#records tbody");

    const pdfButton =
        document.getElementById("pdfButton");

    statusDiv.innerHTML = "Loading...";
    pdfButton.disabled = true;

    try {

        const url = search
            ? API_URL + "?search=" + encodeURIComponent(search)
            : API_URL;

        const response = await fetch(url);

        const result = await response.json();

        if (!response.ok) {
            throw new Error(
                result.error || "Unable to load records"
            );
        }

        if (!Array.isArray(result.records)) {
            throw new Error(
                "The API response does not contain a records array."
            );
        }

        tbody.innerHTML = "";

        for (const record of result.records) {

            const row = document.createElement("tr");

            const dateCell = document.createElement("td");
            dateCell.textContent =
                record.date_of_occurrence || "";

            const descCell = document.createElement("td");
            descCell.textContent =
                record.description || "";

            const amountCell = document.createElement("td");
            amountCell.textContent =
                record.amt_due || "";

            const payeeCell = document.createElement("td");
            payeeCell.textContent =
                record.payee_comments || "";

            const payerCell = document.createElement("td");
            payerCell.textContent =
                record.payer_comments || "";

            row.appendChild(dateCell);
            row.appendChild(descCell);
            row.appendChild(amountCell);
            row.appendChild(payeeCell);
            row.appendChild(payerCell);

            tbody.appendChild(row);
        }

        statusDiv.innerHTML =
            result.records.length + " record(s) found";

        // Remember what was fetched for the PDF
        lastRecords = result.records;
        lastSearch = search;

        pdfButton.disabled =
            lastRecords.length === 0;

    } catch (error) {

        console.error(error);

        statusDiv.innerHTML =
            "Error: " + error.message;

    }
}


function savePdf(){

    const statusDiv =
        document.getElementById("recordsStatus");

    if (lastRecords.length === 0) {
        statusDiv.innerHTML =
            "There are no records to save.";
        return;
    }

    try {

        const { jsPDF } = window.jspdf;

        const doc = new jsPDF({
            orientation: "landscape"
        });

        const now = new Date();

        // Heading
        doc.setFontSize(16);

        doc.text(
            "Accounts Payable - Records",
            14,
            18
        );

        doc.setFontSize(10);

        doc.text(
            "Created: " + now.toLocaleString(),
            14,
            26
        );

        doc.text(
            "Search: " + (lastSearch || "(all records)"),
            14,
            32
        );

        doc.text(
            lastRecords.length + " record(s)",
            14,
            38
        );

        // Records table
        doc.autoTable({

            startY: 44,

            head: [[
                "Date of Occurrence",
                "Description",
                "Amount Due",
                "Payee Comments",
                "Payer Comments"
            ]],

            body: lastRecords.map(record => [

                record.date_of_occurrence || "",

                record.description || "",

                record.amt_due || "",

                record.payee_comments || "",

                record.payer_comments || ""

            ]),

            styles: {
                fontSize: 9,
                cellPadding: 3,
                overflow: "linebreak"
            },

            headStyles: {
                fillColor: [178, 190, 195],
                textColor: 0
            },

            columnStyles: {
                0: { cellWidth: 32 },
                1: { cellWidth: 55 },
                2: { cellWidth: 28 },
                3: { cellWidth: 65 },
                4: { cellWidth: 65 }
            }
        });

        // File name
        const fileDate =
            now.getFullYear() + "-" +
            String(now.getMonth() + 1).padStart(2, "0") + "-" +
            String(now.getDate()).padStart(2, "0");

        doc.save(
            "accounts_payable_" +
            fileDate +
            ".pdf"
        );

    } catch (error) {

        console.error(error);

        statusDiv.innerHTML =
            "Error creating PDF: " + error.message;
    }
}


// Load records when page opens
loadRecords();

</script>

<a href="https://main.d3aa0oh4rm4fbf.amplifyapp.com/">
    Return to home page
</a>

</body>
</html>
