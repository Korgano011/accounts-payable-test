<html>
<head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
<h3>
<a href="/">Back to home page</a>
</h3>

<h2>Add a row</h2>
<form id="addForm">
<label for="date">Date</label>
<input type="date" id="date" name="date" required>
<br><br>
Description: <input type="text" id="description" required>
<br><br>
Amount Due: <input type="number" step="0.01" id="amt_due" required>
<br><br>
Payee Comments: <input type="text" id="payee_comms">
<br><br>
Payer Comments: <input type="text" id="payer_comms">
<br><br>
<button type="submit">Save</button>
</form>
<p id="status"></p>

<h2>Accounts Payable Table</h2>
<button id="savePdf">Save table as PDF</button>
<br><br>
<button id="deleteAll">Delete whole table</button>

<br><br>
Search: <input type="text" id="search" placeholder="Filter by any column">
<br><br>
<table border="1">
  <thead>
    <tr><th>Date</th><th>Description</th><th>Amount Due</th><th>Payee Comments</th><th>Payer Comments</th><th></th></tr>
  </thead>
  <tbody id="rows"></tbody>
</table>

<script>
// On the Mac (localhost) or the Cloudflare tunnel site, nginx is right here.
// Anywhere else (GitHub Pages, Amplify) the page reads the current tunnel address
// from api.json, which publish-tunnel.sh updates each time the tunnel starts.
const SAME_SERVER = ['localhost', '127.0.0.1'].includes(location.hostname)
  || location.hostname.endsWith('.trycloudflare.com');
let API = '/accounts_payable';
const apiReady = SAME_SERVER ? Promise.resolve() :
  fetch('api.json?t=' + Date.now(), { cache: 'no-store' })
    .then(r => r.json())
    .then(c => { API = c.api; })
    .catch(() => { API = 'the tunnel (address not published yet)'; });
const COLS = ['date', 'description', 'amt_due', 'payee_comms', 'payer_comms'];
const HEADERS = ['Date', 'Description', 'Amount Due', 'Payee Comments', 'Payer Comments'];
let currentRows = [];

function setStatus(text) {
  document.getElementById('status').textContent = text;
}

function show(row, c) {
  const v = row[c];
  if (v === null || v === undefined) return '';
  if (c === 'amt_due') return Number(v).toFixed(2);
  return String(v);
}

async function loadRows() {
  try {
    const res = await fetch(API);
    const data = await res.json();
    if (!res.ok) { setStatus('Error: ' + data.error); return; }
    currentRows = data.sort((a, b) => String(a.date).localeCompare(String(b.date)));
    renderTable();
  } catch (err) {
    setStatus('Could not reach the API at ' + API + ' (' + err.message + ')');
  }
}

function renderTable() {
  const search = document.getElementById('search').value.toLowerCase();
  const list = document.getElementById('rows');
  list.innerHTML = '';
  currentRows.filter(row =>
    COLS.some(c => show(row, c).toLowerCase().includes(search))
  ).forEach(row => {
    const tr = document.createElement('tr');
    COLS.forEach(c => {
      const td = document.createElement('td');
      td.textContent = show(row, c);
      tr.appendChild(td);
    });
    const buttonCell = document.createElement('td');
    const editButton = document.createElement('button');
    editButton.textContent = 'Edit';
    editButton.addEventListener('click', () => editRow(tr, row));
    buttonCell.appendChild(editButton);
    const deleteButton = document.createElement('button');
    deleteButton.textContent = 'Delete';
    deleteButton.addEventListener('click', () => deleteRow(row.date));
    buttonCell.appendChild(deleteButton);
    tr.appendChild(buttonCell);
    list.appendChild(tr);
  });
}

function editRow(tr, row) {
  tr.innerHTML = '';
  const inputs = {};
  COLS.forEach(c => {
    const input = document.createElement('input');
    if (c === 'amt_due') { input.type = 'number'; input.step = '0.01'; }
    input.value = show(row, c);
    inputs[c] = input;
    const td = document.createElement('td');
    td.appendChild(input);
    tr.appendChild(td);
  });
  const buttonCell = document.createElement('td');
  const saveButton = document.createElement('button');
  saveButton.textContent = 'Save';
  saveButton.addEventListener('click', () => {
    const updated = {};
    COLS.forEach(c => updated[c] = inputs[c].value);
    updateRow(row.date, updated);
  });
  buttonCell.appendChild(saveButton);
  const cancelButton = document.createElement('button');
  cancelButton.textContent = 'Cancel';
  cancelButton.addEventListener('click', loadRows);
  buttonCell.appendChild(cancelButton);
  tr.appendChild(buttonCell);
}

async function updateRow(oldDate, row) {
  const res = await fetch(API + '/' + encodeURIComponent(oldDate), {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(row)
  });
  const data = await res.json();
  setStatus(res.ok ? 'Updated ' + data.date : 'Error: ' + data.error);
  loadRows();
}

async function deleteRow(date) {
  const res = await fetch(API + '/' + encodeURIComponent(date), { method: 'DELETE' });
  const data = await res.json();
  setStatus(res.ok ? 'Deleted ' + date : 'Error: ' + data.error);
  loadRows();
}

document.getElementById('search').addEventListener('input', renderTable);

document.getElementById('deleteAll').addEventListener('click', async () => {
  if (!confirm('Delete every row in the table?')) return;
  const res = await fetch(API, { method: 'DELETE' });
  const data = await res.json();
  setStatus(res.ok ? 'Deleted all rows' : 'Error: ' + data.error);
  loadRows();
});

document.getElementById('savePdf').addEventListener('click', () => {
  const doc = new jspdf.jsPDF();
  doc.text('Accounts Payable Table', 14, 15);
  doc.autoTable({
    startY: 20,
    head: [HEADERS],
    body: currentRows.map(row => COLS.map(c => show(row, c)))
  });
  doc.save('accounts_payable.pdf');
});

document.getElementById('addForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const row = {};
  COLS.forEach(c => row[c] = document.getElementById(c).value);
  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(row)
    });
    const data = await res.json();
    setStatus(res.ok ? 'Saved ' + data.date : 'Error: ' + data.error);
    if (res.ok) e.target.reset();
  } catch (err) {
    setStatus('Could not reach the API at ' + API + ' (' + err.message + ')');
  }
  loadRows();
});

apiReady.then(loadRows);
</script>
</body>
</html>
