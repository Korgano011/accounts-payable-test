services:
  website:
    image: nginx:latest
    container_name: acct_payable
    volumes:
      - ./:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Editable page: this Mac only
      - 127.0.0.1:8082:80
    networks:
      - default
      - db_default
    restart: always

  # Public site through a free Cloudflare quick tunnel (no account needed).
  # The address changes whenever this container restarts, so start everything with
  # ./publish-tunnel.sh, which also sends the new address to GitHub (api.json).
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: acct_payable_tunnel
    command: tunnel --no-autoupdate --url http://acct_payable:8090
    depends_on:
      - website
    networks:
      - default
    restart: unless-stopped

networks:
  db_default:
    external: true

# docker compose -f accts.yaml up -d
# Start + publish the tunnel address: ./publish-tunnel.sh   (stop it: docker stop acct_payable_tunnel)
