server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Never serve dotfiles such as .env (holds the ngrok token)
    location ~ /\. {
        deny all;
    }

    # The page calls /accounts_payable; nginx hands those calls to the API container
    location /accounts_payable {
        proxy_pass http://test-api:3000;
        proxy_set_header Host $host;
    }
}

# Public, read-only site. Only the ngrok tunnel container talks to this port
# (it is not published on the Mac). Serves just public/ and only GET on the table.
server {
    listen 8090;
    server_name _;
    root /usr/share/nginx/html/public;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    location = /accounts_payable {
        # Let the GitHub Pages copy of the page read the table (read-only)
        add_header Access-Control-Allow-Origin "https://korgano011.github.io" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "ngrok-skip-browser-warning" always;

        # Browser preflight check before the cross-site GET
        if ($request_method = OPTIONS) {
            return 204;
        }

        limit_except GET OPTIONS {
            deny all;
        }
        proxy_pass http://test-api:3000;
        proxy_set_header Host $host;
        # test-api sends its own "*" header; use only the github.io one above
        proxy_hide_header Access-Control-Allow-Origin;
    }

    # Anything else (notes, yaml files, edit routes) is not served publicly
    location / {
        return 404;
    }
}
