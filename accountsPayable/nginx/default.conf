server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Never serve dotfiles such as .env (holds the ngrok token)
    location ~ /\. {
        deny all;
    }

    # The page calls /accounts_payable; nginx hands those calls to the API container
    location /accounts_payable {
        proxy_pass http://test-api:3000;
        proxy_set_header Host $host;
    }
}

# Public, read-only site. Only the Cloudflare tunnel container talks to this port
# (it is not published on the Mac). Serves just public/ and only GET on the table.
server {
    listen 8090;
    server_name _;
    root /usr/share/nginx/html/public;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    location = /accounts_payable {
        limit_except GET {
            deny all;
        }
        proxy_pass http://test-api:3000;
        proxy_set_header Host $host;
    }

    # Anything else (notes, yaml files, edit routes) is not served publicly
    location / {
        return 404;
    }
}
