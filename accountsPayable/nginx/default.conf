# Sites allowed to call the table API through ngrok: GitHub Pages and the Amplify copy
map $http_origin $ap_cors_origin {
    default                                   "https://korgano011.github.io";
    "https://korgano011.github.io"            $http_origin;
    "https://main.d3aa0oh4rm4fbf.amplifyapp.com" $http_origin;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Never serve dotfiles such as .env (holds the ngrok token)
    location ~ /\. {
        deny all;
    }

    # The page calls /accounts_payable; nginx hands those calls to the API container
    location /accounts_payable {
        proxy_pass http://test-api:3000;
        proxy_set_header Host $host;
    }
}

# Public site. Only the ngrok tunnel container talks to this port
# (it is not published on the Mac). Serves public/ plus the open table API.
server {
    listen 8090;
    server_name _;
    root /usr/share/nginx/html/public;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    # Fully open by choice (2026-11-05): anyone can add, edit and delete rows,
    # so the GitHub Pages copy of index1.html works like the local one.
    location /accounts_payable {
        add_header Access-Control-Allow-Origin $ap_cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, ngrok-skip-browser-warning" always;

        # Browser preflight check before cross-site calls
        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://test-api:3000;
        proxy_set_header Host $host;
        # test-api sends its own "*" header; use only the github.io one above
        proxy_hide_header Access-Control-Allow-Origin;
    }

    # Anything else (notes, yaml files, edit routes) is not served publicly
    location / {
        return 404;
    }
}
